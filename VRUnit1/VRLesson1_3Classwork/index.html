<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Task 1: Using the color attribute make the following tree look better -->
      <a-sphere position="0 4 -5" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-1 3 -5" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="1 3 -5" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-cylinder position="0 0.75 -5" radius="0.5" height="3.5" color="#573813"></a-cylinder>

      <a-sphere position="0 4 11" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-1 3 11" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="1 3 11" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-cylinder position="0 0.75 11" radius="0.5" height="3.5" color="#573813"></a-cylinder>

      <a-sphere position="-3 4 -8" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-4 3 -8" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-2 3 -8" radius="1.25" src="texture_grass.jpeg" repeat="10 10"></a-sphere>
      <a-cylinder position="-3 0.75 -8" radius="0.5" height="3.5" color="#573813"></a-cylinder>

      <!--biome change-->

      <a-sphere position="0 4 35" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-1 3 35" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="1 3 35" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-cylinder position="0 0.75 35" radius="0.5" height="3.5" color="#573813"></a-cylinder>

      <a-sphere position="0 4 51" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-1 3 51" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="1 3 51" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-cylinder position="0 0.75 51" radius="0.5" height="3.5" color="#573813"></a-cylinder>

      <a-sphere position="-3 4 32" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-4 3 32" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-sphere position="-2 3 32" radius="1.25" src="texture_snow.jpeg" repeat="10 10"></a-sphere>
      <a-cylinder position="-3 0.75 32" radius="0.5" height="3.5" color="#573813"></a-cylinder>

     <!-- Task 2: Using one of the texture images make the plane look like the ground.  Don't forget to repeat the image if it looks blurred. -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="50" height="50" src="texture_grass.jpeg" repeat="5 5"></a-plane>

      <a-plane position="0 0 50" rotation="-90 0 0" width="50" height="50" src="texture_snow.jpeg" repeat="5 5"></a-plane>

      <!-- Task 3: Using either the sky or bk images, change the sky component -->
      <a-sky src="sky1.jpeg" ></a-sky>
    </a-scene>
  </body>
</html>
